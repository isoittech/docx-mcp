name: word-mcp

x-word-environment: &word-environment
  WordMcp__SharedSecret: ${WORD_MCP_SHARED_SECRET:?set WORD_MCP_SHARED_SECRET}
  WordMcp__ArtifactSigningKey: ${WORD_MCP_ARTIFACT_SIGNING_KEY:?set WORD_MCP_ARTIFACT_SIGNING_KEY}
  WordMcp__ScopeHmacKey: ${WORD_MCP_SCOPE_HMAC_KEY:?set WORD_MCP_SCOPE_HMAC_KEY}
  WordMcp__PublicBaseUrl: ${WORD_MCP_PUBLIC_BASE_URL:-http://127.0.0.1:18081}
  WordMcp__LocalDevelopment: ${WORD_MCP_LOCAL_DEVELOPMENT:-true}
  WordMcp__StorageRoot: /data/word-mcp
  WordMcp__LibreChatUploadsRoot: /data/librechat-uploads
  WordMcp__TemplatesRoot: /data/word-templates
  WordMcp__DefaultTemplateId: ${WORD_MCP_DEFAULT_TEMPLATE_ID:-}
  WordMcp__FirstAssistantNotice: ${WORD_MCP_FIRST_ASSISTANT_NOTICE:-}

services:
  word-mcp:
    build:
      context: .
      target: runtime
    environment: *word-environment
    read_only: true
    user: "1654:1654"
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m,uid=1654,gid=1654,mode=0700
    volumes:
      - ${WORD_MCP_STORAGE_PATH:?set WORD_MCP_STORAGE_PATH}:/data/word-mcp:rw
      - ${WORD_MCP_UPLOADS_PATH:?set WORD_MCP_UPLOADS_PATH}:/data/librechat-uploads:ro
      - ${WORD_MCP_TEMPLATES_PATH:?set WORD_MCP_TEMPLATES_PATH}:/data/word-templates:ro
    networks:
      - word-internal
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  word-codex-proxy:
    image: nginx:1.31.3-alpine3.24@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
    user: "101:101"
    depends_on:
      word-mcp:
        condition: service_healthy
    volumes:
      - ./integrations/codex/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:${WORD_MCP_PORT:-18081}:8080"
    read_only: true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.25
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,nodev,size=16m
      - /var/run:rw,noexec,nosuid,nodev,size=4m
      - /tmp:rw,noexec,nosuid,nodev,size=8m
    networks:
      - word-internal
    restart: unless-stopped

  test:
    build:
      context: .
      target: test
    environment:
      WORD_MCP_RENDER_INTEGRATION: "1"
    pids_limit: 512
    mem_limit: 4g
    cpus: 3.0
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=1g
    profiles: ["tools"]

  audit:
    build:
      context: .
      target: audit
    profiles: ["tools"]

networks:
  word-internal:
    internal: true
