worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    access_log off;
    error_log /dev/stderr warn;
    server_tokens off;

    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    map $http_authorization $word_mcp_has_bearer {
        default 0;
        ~^Bearer\s+\S+$ 1;
    }

    server {
        listen 8080;
        client_max_body_size 2m;

        location = /mcp {
            if ($word_mcp_has_bearer = 0) {
                return 401;
            }

            proxy_pass http://word-mcp:8080;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-LibreChat-User-ID "local-codex-user";
            proxy_set_header X-LibreChat-Conversation-ID "local-codex-conversation";
            proxy_set_header X-LibreChat-Message-ID "local-codex-message";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 65s;
            proxy_send_timeout 65s;
        }

        location ^~ /artifacts/ {
            limit_except GET HEAD {
                deny all;
            }

            proxy_pass http://word-mcp:8080;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 10m;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy no-referrer always;
        }

        location = /health/ready {
            limit_except GET {
                deny all;
            }

            proxy_pass http://word-mcp:8080/health/ready;
            access_log off;
        }

        location / {
            return 404;
        }
    }
}
